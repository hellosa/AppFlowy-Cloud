[package]
name = "background-indexer-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
app_error = { path = "../../backend/app_error" }
database = { path = "../../backend/database" }
indexer = { path = "../../backend/crates/indexer" }
appflowy-worker = { path = "../../services/appflowy-worker" }

tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
dotenv = "0.15"
config = "0.13"
serde = { version = "1", features = ["derive"] }
redis = { version = "0.25.0", features = ["tokio-comp", "connection-manager"] }
sqlx = { version = "0.7", features = [ "runtime-tokio", "postgres", "uuid", "chrono", "json"] }
log = "0.4" 